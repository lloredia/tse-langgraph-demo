[project]
name = "tse-langgraph-demo"
version = "0.2.0"
description = "Technical Support Engineer workflow demo built with LangGraph and LangSmith."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lesley Oredia" }]
dependencies = [
  "langgraph>=1.2.12,<2",
  "langchain-core>=1.6.7,<2",
  "langchain-openai>=1.6.7,<2",
  "langsmith>=0.14.4,<1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
tse-demo = "tse_demo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tse_demo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
